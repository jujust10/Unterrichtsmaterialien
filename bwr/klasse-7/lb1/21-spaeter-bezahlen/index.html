.provider-tag{display:inline-block;margin:0 0 3px;padding:5px 10px;background:var(--soft);color:var(--accent);font-size:.84rem;font-weight:750;border-radius:8px}

.demo-login input[readonly]{height:48px;background:#fff;border-color:var(--edge)}

.pay-option strong,.pay-option small{display:block}

function pdfUrl(base64){const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));return URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));}
function paymentPdf(key){return pdfUrl(paymentPdfs[key]);}
const methods={
 paypal:{name:'PayPal – Bezahlung nach 30 Tagen',payee:'PayPal',date:'30 Tage nach der Buchung',action:'PayPal bucht den Gesamtbetrag automatisch von der gewählten Zahlungsquelle ab. Für die regulären 30 Tage kommen keine Gebühren hinzu.',button:'Zahlungsaufschub bestätigen'},
 klarna:{name:'Klarna – in bis zu 30 Tagen bezahlen',payee:'Klarna',date:'In diesem Beispiel spätestens nach 30 Tagen',action:'Öffne die Bestellung in der Klarna-Übersicht und bezahle dort bis zum angezeigten Datum.',button:'Zahlungsaufschub bestätigen'},
 invoice:{name:'Kauf auf Rechnung',payee:'KartArena',date:'14 Tage nach Erhalt der Rechnung',action:'Überweise den Betrag selbst. Nutze die Kontodaten und den Verwendungszweck auf der Rechnung.',button:'Auf Rechnung buchen'}
};
let selected='';
function show(stage,title,body){
 view.innerHTML='<div class="stage">'+stage+'</div><h1 id="title" tabindex="-1">'+title+'</h1>'+body;
 if(stage!=='1 · Warenkorb')view.querySelector('h1').focus();
}
function cart(){
 selected='';
 show('1 · Warenkorb','Dein Warenkorb','<p>Zwei Fahrten auf der Indoor-Kartbahn. Das digitale Ticket erhältst du direkt nach der Buchung.</p><button class="primary" id="checkout">Zur Kasse</button>');
 view.querySelector('#checkout').onclick=checkout;
}
function checkout(){
 leaveProvider();
 const options=Object.entries(methods).map(([key,item])=>'<label class="method"><input type="radio" name="payment" value="'+key+'" '+(key===selected?'checked':'')+'>'+item.name+'</label>').join('');
 show('2 · Kasse','Zur Kasse','<label for="name">Name auf dem Ticket</label><input id="name" type="text" value="Lea Fuchs" readonly><p class="stage">Die Buchung wird im Modell von einer erwachsenen Person bestätigt.</p><label for="mail">Empfängeradresse für das PDF-Ticket</label><input id="mail" type="email" value="lea.fuchs@example.com" readonly><h2>Zahlungsart auswählen</h2><label class="method review"><input type="radio" disabled>SEPA-Lastschrift</label><label class="method review"><input type="radio" disabled>Kreditkarte (Visa/Mastercard)</label>'+options+'<p class="stage">PayPal und Klarna ab 18. Für einen direkten Kauf auf Rechnung brauchen Minderjährige grundsätzlich die Zustimmung der Eltern. Der Händler kann ein Mindestalter festlegen.</p><p id="message" role="status"></p><button class="primary" id="continue">Weiter</button><button class="secondary" id="back">Zum Warenkorb</button>');
 view.querySelector('#back').onclick=cart;
 view.querySelector('#continue').onclick=()=>{
  const radio=view.querySelector('input:checked');
  if(!radio){const m=view.querySelector('#message');m.className='error';m.textContent='Wähle einen Zahlungsweg mit späterer Fälligkeit.';return;}
  selected=radio.value;
  if (selected==='invoice') review();
  else providerLogin();
 };
}

const providerViews = {
 paypal: {label:'PayPal', badge:'Web-Checkout', icon:'P'},
 klarna: {label:'Klarna', badge:'App-Ansicht', icon:'K'}
};
const shopHeader = document.querySelector('header').innerHTML;

function leaveProvider(){
 if (!document.body.dataset.provider) return;
 delete document.body.dataset.provider;
 document.querySelector('header').innerHTML=shopHeader;
 document.title='KartArena · Buchung';
}

function providerButton(id, action){
 view.querySelector('#'+id).addEventListener('click',action);
}

function providerScreen(stage,title,body){
 const provider=providerViews[selected];
 show(stage,title,'<p class="provider-tag">'+provider.badge+' · Unterrichtssimulation</p>'+body);
}

function providerLogin(){
 const provider=providerViews[selected];
 document.body.dataset.provider=selected;
 document.title=provider.label+' · Zahlungsübung';
 document.querySelector('header').innerHTML='<span class="mark" aria-hidden="true">'+provider.icon+'</span><span class="brand">'+provider.label+'</span><span class="badge">Unterrichtssimulation</span>';
 const fields='<div class="demo-login"><label for="demo-email">E-Mail des Modellkontos</label><input id="demo-email" type="text" value="modellkonto@kartarena.example" readonly autocomplete="off"><label for="demo-secret">Muster-PIN</label><input id="demo-secret" type="text" value="••••••" readonly autocomplete="off"></div>';
 providerScreen('Anmeldung',provider.label+' öffnen','<p>Die KartArena hat dich zur Zahlungsübung weitergeleitet. Das Modellkonto einer erwachsenen Person ist vorbereitet.</p>'+fields+'<button class="primary" id="provider-login">Anmelden</button><button class="secondary" id="provider-back">Zurück zur Kasse</button>');
 providerButton('provider-login',selected==='paypal'?payPalChoice:klarnaReview);
 providerButton('provider-back',checkout);
}

function payPalChoice(){
 providerScreen('PayPal · Zahlungsart','Zahlungsart auswählen','<p>KartArena · Gesamtbetrag <strong>54,00 €</strong></p><label class="pay-option"><input id="pay-later" type="radio" name="paypal-method"><span><strong>Bezahlung nach 30 Tagen</strong><small>Heute 0,00 € · in 30 Tagen 54,00 €</small></span></label><p id="provider-message" role="status"></p><button class="primary" id="provider-check">Weiter zur Bonitätsprüfung</button><button class="secondary" id="provider-back">Zurück zur Kasse</button>');
 providerButton('provider-check',()=>{
  if (!view.querySelector('#pay-later').checked){
   const message=view.querySelector('#provider-message');
   message.className='error';
   message.textContent='Wähle zuerst „Bezahlung nach 30 Tagen“ aus.';
   view.querySelector('#pay-later').focus();
   return;
  }
  payPalApproved();
 });
 providerButton('provider-back',checkout);
}

function payPalApproved(){
 providerScreen('PayPal · Prüfung und Bestätigung','Bonitätsprüfung abgeschlossen','<p class="notice" role="status"><strong>Im Modell freigegeben.</strong> PayPal prüft bei der Bonitätsprüfung die Kreditwürdigkeit. Jetzt kannst du die Buchung bestätigen.</p>'+details(methods.paypal)+'<button class="primary" id="provider-confirm">Kauf bestätigen</button><button class="secondary" id="provider-back">Zurück zur Zahlungsart</button>');
 providerButton('provider-confirm',confirmation);
 providerButton('provider-back',payPalChoice);
}

function klarnaReview(){
 providerScreen('Klarna · Bestellung prüfen','Zahlung bestätigen','<p>KartArena · Zwei Kartfahrten</p>'+details(methods.klarna)+'<button class="primary" id="provider-confirm">Zahlung bestätigen</button><button class="secondary" id="provider-back">Zurück zur Kasse</button>');
 providerButton('provider-confirm',confirmation);
 providerButton('provider-back',checkout);
}

function details(item){
 return '<dl class="details"><div><dt>Empfänger</dt><dd>'+item.payee+'</dd></div><div><dt>Fälligkeit</dt><dd>'+item.date+'</dd></div><div><dt>Offener Betrag</dt><dd>54,00 €</dd></div><div><dt>Heute zu zahlen</dt><dd>0,00 €</dd></div></dl><p>'+item.action+'</p>';
}
function review(){
 const item=methods[selected];
 const notice=selected==='invoice'?'Die Rechnung erhältst du in dieser Übung direkt von der Kartbahn.':'Im Modell hat der Zahlungsdienst die spätere Zahlung freigegeben.';
 show('3 · Prüfen und buchen',item.name,details(item)+'<p class="notice">'+notice+'</p><button class="primary" id="book">'+item.button+'</button><button class="secondary" id="back">Zahlungsart ändern</button>');
 view.querySelector('#back').onclick=checkout;
 view.querySelector('#book').onclick=confirmation;
}
function confirmation(){
 leaveProvider();
 const item=methods[selected];
 const extra=selected==='invoice'?'<p>Rechnung KR-207 · Verwendungszweck: KR-207 Lea Fuchs. Die Rechnung enthält Muster-Zahlungsdaten.</p>':'<p>Vorgang KA-207 · Die nächsten Schritte findest du in diesem Zahlungsbeleg.</p>';
 show('4 · Zahlungsbeleg','Gebucht. Zahlung steht noch aus.',details(item)+extra+'<a id="paymentPdf" class="download" target="_blank" rel="noopener">'+(selected==='invoice'?'Musterrechnung als PDF öffnen':'Zahlungsbeleg als PDF öffnen')+'</a><a id="ticket" class="download" download="KartArena-Ticketbogen-KA207.pdf">Ticketbogen herunterladen</a><button id="mail" class="secondary">E-Mail ansehen</button><button id="reset" class="secondary">Neue Buchung</button><section id="receipt" aria-live="polite"></section>');
 view.querySelector('#paymentPdf').href=paymentPdf(selected);
 view.querySelector('#ticket').href=ticketPdf;
 view.querySelector('#reset').onclick=cart;
 view.querySelector('#mail').onclick=()=>{
  view.querySelector('#receipt').innerHTML='<div class="notice"><strong>Ticket-E-Mail · Vorschau</strong><p>An lea.fuchs@example.com<br>Betreff · Deine KartArena-Buchung KA-207</p><p>Hallo Lea, im Anhang findest du zwei Tickets zum Ausdrucken, für Lea und Max. Termin: 05.12.2026 um 15:30 Uhr.</p><a class="download" href="'+ticketPdf+'" download="KartArena-Ticketbogen-KA207.pdf">PDF-Anhang öffnen</a></div>';
 };
}
function modelBank(){
 const aside=document.querySelector('aside');
 aside.innerHTML='<h2>Offene Zahlung</h2><p class="amount"><span>PayPal · Tag 30</span><strong>54,00 €</strong></p><p>KartArena · KA-207</p>';
 show('KlarKonto · Modellkonto','Kontostand 40,00 €','<p>Heute ist die PayPal-Zahlung für die bereits gebuchten Kartfahrten fällig.</p><button class="primary" id="debit">Abbuchung im Modell prüfen</button><button class="secondary" id="delay">Verlängerung ansehen</button><section id="result" aria-live="polite"></section><p><a href="./">Zurück zum Kartshop</a></p>');
 const result=view.querySelector('#result');
 view.querySelector('#debit').onclick=()=>{result.innerHTML='<p class="notice"><strong>Abbuchung im Modell nicht möglich.</strong> Auf dem Konto fehlen 14,00 €.</p>';};
 view.querySelector('#delay').onclick=()=>{
  result.innerHTML='<div class="notice"><strong>Modellangebot vor dem Abbuchungstermin</strong><p>Neuer Termin: Tag 60. Gebühr: 3,00 €. Neuer Gesamtbetrag: 57,00 €.</p></div><button class="secondary" id="income">20 € Geldeingang berücksichtigen</button><p id="projection"></p>';
  view.querySelector('#income').onclick=()=>{view.querySelector('#projection').textContent='Bei einem sicheren Eingang von 20,00 € stehen am 60. Tag 60,00 € zur Verfügung. Nach der Abbuchung bleiben 3,00 €.';};
