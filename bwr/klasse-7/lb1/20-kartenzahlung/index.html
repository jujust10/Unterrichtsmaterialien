function checkout(message=''){
 const needsChip=scenario!=='standard';
 const prompt=needsChip?'Das Terminal bittet dich, die Karte in den Schlitz zu stecken.':'Prüfe den Betrag. Ziehe deine Karte auf die Funkwellen oder in den Schlitz.';
 const terminalCases='<details class="terminal-cases"><summary>Weitere Terminalfälle ausprobieren</summary>'+action('chip-demo','Terminal verlangt die Chipkarte')+(card.type==='credit'?action('signature-demo','Sonderfall mit Unterschrift'):'')+'</details>';
 view('Karte am Terminal einsetzen',layout('<p>'+prompt+'</p><div class="drag-card" id="drag-card"><img src="'+card.image+'" alt="'+card.label+'" draggable="false"></div>'+status+'<div class="buttons">'+action('reset','Andere Karte wählen')+'</div>'+terminalCases,
 terminal('<span>Trampolinhalle</span><strong class="amount">18,00 €</strong><span>'+(needsChip?'Bitte Karte einstecken':'Karte vorhalten oder einstecken')+'</span>','<div class="targets"><button class="target" data-act="tap"><span class="waves" aria-hidden="true">)))</span>Kontaktlosfeld</button><button class="target" data-act="insert"><span class="slot"></span>Kartenschlitz</button></div>')));
 if(message)say(message);
 const drag=document.querySelector('#drag-card');
 let ghost,start,track;
 drag.addEventListener('pointerdown',e=>{
  e.preventDefault();drag.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};
  ghost=new Image();ghost.src=card.image;ghost.className='ghost';document.body.append(ghost);track=null;position(e);
 });
 function position(e){
  if(!ghost)return;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  track?.classList.remove('drop');
  track=document.elementFromPoint(e.clientX,e.clientY)?.closest('.target');
  track?.classList.add('drop');
 }
 drag.addEventListener('pointermove',position);
 drag.addEventListener('pointerup',e=>{
  if(!ghost)return;
  position(e);const target=track?.dataset.act;
  const moved=Math.hypot(e.clientX-start.x,e.clientY-start.y)>20;
  ghost.remove();ghost=null;track?.classList.remove('drop');track=null;
  if(target&&moved)authorize(target);
  else if(moved)say('Ziehe die Karte bis auf das Kontaktlosfeld oder den Kartenschlitz.');
 });
 drag.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;track?.classList.remove('drop');track=null;});
}
function authorize(chosen){
 if(chosen==='tap'&&scenario!=='standard'){
  say('Bitte stecke die Karte in den Kartenschlitz.');
  return;
 }
 method=chosen;
 if(chosen==='tap'){
  verification='Ohne PIN bestätigt';
  approved();
  return;
 }
 const inserted='<div class="inserted" aria-hidden="true"><span class="slot"></span><img src="'+card.image+'" alt=""></div>';
 if(scenario!=='signature'){
  pin='';
  const keypad='<div class="keypad">'+[1,2,3,4,5,6,7,8,9,'Löschen',0,'OK'].map(v=>action(v==='OK'?'pin-ok':v==='Löschen'?'pin-clear':'digit'+v,String(v))).join('')+'</div>';
  view('Zahlung bestätigen',layout('<p>Lass die Karte stecken. Gib die <strong>Übungs-PIN 1234</strong> auf der Tastatur am Terminal ein und bestätige mit OK.</p>'+status,terminal('<span>Bitte PIN eingeben</span><strong class="amount">18,00 €</strong><div id="pin-view" aria-live="polite">○ ○ ○ ○</div>',keypad+inserted)));
 }else{
  hasSignature=false;
  view('Zahlung bestätigen',layout('<p>In diesem Sonderfall verlangt das Terminal eine Unterschrift. Schreib mit dem Finger oder Stift <strong>Schweis</strong> auf das Feld am Terminal.</p><p class="intro">Bei einer modernen Kartenzahlung ist die Unterschrift heute keine Standardanforderung.</p>'+status,
   terminal('<span>Bitte unterschreiben · 18,00 €</span><canvas id="signature" class="signature" width="480" height="120" aria-label="Feld für die Musterunterschrift"></canvas>', '<div class="buttons">'+action('sign-ok','Unterschrift bestätigen',true)+action('sign-clear','Löschen')+'</div>'+inserted)));
  const cv=document.querySelector('#signature'),ctx=cv.getContext('2d');
  let point=null;ctx.strokeStyle='#193e2f';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  function local(e){const box=cv.getBoundingClientRect();return [(e.clientX-box.left)*cv.width/box.width,(e.clientY-box.top)*cv.height/box.height];}
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);point=local(e);});
  cv.addEventListener('pointermove',e=>{
   if(!point)return;
   const next=local(e);
   if(Math.hypot(next[0]-point[0],next[1]-point[1])<1)return;
   ctx.beginPath();ctx.moveTo(...point);ctx.lineTo(...next);ctx.stroke();point=next;hasSignature=true;
  });
  for(const name of ['pointerup','pointercancel'])cv.addEventListener(name,()=>{point=null;});
 }
}
function approved(){
 const confirmation=verification==='signature'?'<span>Unterschrift</span><span class="signed">Schweis</span>':'<span>'+verification+'</span>';
 view('Zahlung genehmigt',layout('<h2>Sag voraus</h2><p>Der Einkauf wurde gerade bezahlt. Ist die Abbuchung in unserem Übungskonto schon bei den Girokonto-Umsätzen zu sehen?</p><div class="buttons">'+action('predict-yes','Ja, im Girokonto')+action('predict-no','Nein, noch nicht')+'</div>'+status,
 terminal('<strong>Zahlung genehmigt</strong><strong class="amount">18,00 €</strong>'+confirmation+'<span>'+ (method==='tap'?'Kontaktlos bezahlt':'Karte eingesetzt')+'</span>')));
}
function bank(next='activity'){
 const debit=card.type==='debit',credit=!debit;
 const bankRows=(rows)=>'<table><thead><tr><th>Buchung</th><th>Betrag</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table>';
 const activity=bankRows([...(debit?[['Heute · Trampolinhalle','−18,00 €']]:[]),['Gestern · Supermarkt','−24,50 €'],['Gestern · Überweisung','+45,00 €']]);
 const content=next==='activity'?activity:(credit?'<p class="pending"><strong>Vorgemerkt für die nächste Monatsabrechnung</strong></p>'+bankRows([['Heute · Trampolinhalle','18,00 €']]):'<p>Die Debitkartenzahlung erscheint hier im Girokonto unter „Umsätze“.</p>');
 const prompt=next==='activity'?'<h2>Prüfe den Verlauf</h2><p>Belege am Konto, ob die 18,00 € bereits abgebucht wurden.</p><div class="buttons">'+action('seen','18,00 € stehen in den Girokonto-Umsätzen')+action('missing','18,00 € fehlen in den Girokonto-Umsätzen')+'</div>':'<h2>Deute den Karteneintrag</h2><p>Wann wird das Girokonto für diese Kreditkartenzahlung belastet?</p><div class="buttons">'+action('monthly','Mit der nächsten Sammelabrechnung')+action('now','Schon jetzt')+'</div>';
 view('Kontoverlauf ansehen','<section class="bank"><div class="bank-head"><strong>KlarKonto · Modellbank</strong><small>Guten Tag, Lea Schweis</small></div><div class="summary"><span>Girokonto</span><div class="balance">'+fmt(debit?102:120)+'</div><span class="badge">Bereits angemeldet</span></div><div class="bank-body"><div class="buttons">'+action('activity','Girokonto · Umsätze',next==='activity')+(credit?action('credit-activity','Kreditkarte · Kartenumsätze',next!=='activity'):'')+'</div>'+content+'</div></section><section class="panel">'+prompt+status+'<div id="follow"></div></section>');
}
function allowNext(id,label){document.querySelector('#follow').innerHTML='<div class="buttons">'+action(id,label,true)+'</div>';}
root.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const id=el.dataset.act;
 if(/^card[0-3]$/.test(id)){card=cards[Number(id.at(-1))];checkout();}
 else if(id==='reset'){choose();}
 else if(id==='chip-demo'||id==='signature-demo'){
  scenario=id==='chip-demo'?'chip':'signature';
  checkout();
 }
 else if(id==='tap'||id==='insert'){authorize(id);}
 else if(id.startsWith('digit')||id.startsWith('pin-')){
  if(id.startsWith('digit')&&pin.length<4)pin+=id.at(-1);
  if(id==='pin-clear')pin=pin.slice(0,-1);
  if(id==='pin-ok'){if(pin==='1234'){verification='PIN bestätigt';approved();return;}pin='';say('Das Terminal kann die Zahlung erst mit der richtigen PIN bestätigen. Probiere die Übungs-PIN 1234.');}
  document.querySelector('#pin-view').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ');
 }
 else if(id==='sign-clear'){const cv=document.querySelector('#signature');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);hasSignature=false;say('');}
 else if(id==='sign-ok'){if(hasSignature){verification='signature';approved();}else say('In diesem Sonderfall braucht das Terminal eine Unterschrift zur Bestätigung. Schreib „Schweis“ ins Feld.');}
 else if(id==='predict-yes'||id==='predict-no'){
  const debit=card.type==='debit';
  const correct=(id==='predict-yes')===debit;
  const explanation=debit?'Bei einer Debitkarte geht die Zahlung zeitnah direkt vom Girokonto ab.':'Leas Kreditkarte sammelt die Einkäufe. Das Girokonto wird erst mit der Monatsabrechnung belastet.';
  say((correct?'Deine Vermutung stimmt. ':'Deine Vermutung passt hier noch nicht. ')+explanation,correct?'good':'bad');
  document.querySelector('#status').insertAdjacentHTML('afterend','<div class="buttons">'+action('activity','KlarKonto öffnen · Umsätze prüfen',true)+'</div>');
  for(const b of root.querySelectorAll('[data-act^="predict-"]'))b.disabled=true;
 }
 else if(id==='activity'||id==='credit-activity'){bank(id);}
 else if(id==='seen'||id==='missing'){
  const debit=card.type==='debit';
  if((id==='seen')!==debit){
   say(debit?'Bei dieser Debitkartenzahlung steht „Trampolinhalle −18,00 €“ bereits in den Girokonto-Umsätzen.':'Die Trampolinhalle fehlt im Girokonto, weil die Kreditkarte den Betrag für die Monatsabrechnung sammelt.');return;
  }
  if(debit){say('Richtig. Die Debitkarte belastet das Girokonto. Deshalb siehst du „Trampolinhalle −18,00 €“ und den neuen Kontostand von 102,00 €.','good');allowNext('reset','Eine andere Karte ausprobieren');}
  else{say('Richtig. Die Kreditkarte rechnet gesammelt ab. Deshalb stehen im Girokonto noch 120,00 € und der Einkauf steht in den Kartenumsätzen.','good');allowNext('credit-activity','Kreditkartenumsätze ansehen');}
 }
 else if(id==='monthly'||id==='now'){
  if(id==='monthly'){say('Richtig. Die Zahlung ist vorgemerkt. Das Girokonto wird beim nächsten Abrechnungstermin belastet.','good');allowNext('reset','Mit der anderen Karte vergleichen');}
  else say('Der Betrag ist auf der Kreditkarte vorgemerkt. Erst die Monatsabrechnung belastet das Girokonto.');
 }
});
choose();
</script></html>
