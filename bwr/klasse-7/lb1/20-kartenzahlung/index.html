const cards=[
 {label:'Sparkassen-Card · girocard / Visa Debit',type:'debit',image:assets[0]},
 {label:'VR GoldCard · Mastercard Credit',type:'credit',image:assets[1]}
];
const root=document.querySelector('#app');
const fmt=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
let card=null,pin='',method='',hasSignature=false;
const action=(id,label,primary=false)=>'<button type="button" class="btn '+(primary?'primary':'')+'" data-act="'+id+'">'+label+'</button>';
const status='<p class="status" id="status" role="status"></p>';
function say(text,kind='bad'){const el=document.querySelector('#status');if(el){el.textContent=text;el.className='status '+kind;}}
function view(title,content){
 root.innerHTML='<h1>'+title+'</h1>'+content;
 root.querySelector('h1').tabIndex=-1;root.querySelector('h1').focus({preventScroll:true});
}
function terminal(content,extra=''){return '<div class="device"><div class="screen">'+content+'</div>'+extra+'</div>';}
function choose(){
 card=null;pin='';method='';
 view('Bezahle zwei Eintritte', '<p class="intro">Die Kasse akzeptiert girocard, Visa und Mastercard. Wähle Axels Karte für die 18,00 €.</p><section class="panel card-wrap">'+cards.map((c,i)=>'<button type="button" class="option" data-act="card'+i+'"><img src="'+c.image+'" alt=""><span>'+c.label+'</span></button>').join('')+'</section>');
}
function layout(left,right){return '<div class="layout"><section class="panel">'+left+'</section><section class="panel">'+right+'</section></div>';}
function checkout(){
 view('Karte am Terminal einsetzen',layout('<p>Prüfe den Betrag auf dem Terminal. Ziehe deine Karte auf das Kontaktlosfeld oder in den Schlitz.</p><div class="drag-card" id="drag-card"><img src="'+card.image+'" alt="'+card.label+'" draggable="false"></div>'+status+'<div class="buttons">'+action('reset','Andere Karte wählen')+'</div>',
 terminal('<span>Trampolinhalle</span><strong class="amount">18,00 €</strong><span>Karte vorhalten oder einstecken</span>','<div class="targets"><button class="target" data-act="tap">))) Kontaktlosfeld</button><button class="target" data-act="insert"><span class="slot"></span>Kartenschlitz</button></div>')));
 const drag=document.querySelector('#drag-card');
 let ghost,start,track;
 drag.addEventListener('pointerdown',e=>{
  e.preventDefault();drag.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};
  ghost=new Image();ghost.src=card.image;ghost.className='ghost';document.body.append(ghost);track=null;position(e);
 });
 function position(e){
  if(!ghost)return;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  track?.classList.remove('drop');
  track=document.elementFromPoint(e.clientX,e.clientY)?.closest('.target');
  track?.classList.add('drop');
 }
 drag.addEventListener('pointermove',position);
 drag.addEventListener('pointerup',e=>{
  if(!ghost)return;
  position(e);const target=track?.dataset.act;
  const moved=Math.hypot(e.clientX-start.x,e.clientY-start.y)>20;
  ghost.remove();ghost=null;track?.classList.remove('drop');track=null;
  if(target&&moved)authorize(target);
  else if(moved)say('Ziehe die Karte bis auf das Kontaktlosfeld oder den Kartenschlitz.');
 });
 drag.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;track?.classList.remove('drop');track=null;});
}
function authorize(chosen){
 method=chosen;
 if(card.type==='debit'){
  pin='';
  const keypad='<div class="keypad">'+[1,2,3,4,5,6,7,8,9,'Löschen',0,'OK'].map(v=>action(v==='OK'?'pin-ok':v==='Löschen'?'pin-clear':'digit'+v,String(v))).join('')+'</div>';
  view('Zahlung bestätigen',layout('<p>Das Terminal verlangt bei dieser girocard-Zahlung eine PIN. Nutze die <strong>Übungs-PIN 1234</strong>.</p>'+status,terminal('<span>Bitte PIN eingeben</span><strong class="amount">18,00 €</strong><div id="pin-view" aria-live="polite">○ ○ ○ ○</div>',keypad)));
 }else{
  hasSignature=false;
  view('Zahlung bestätigen',layout('<p>Bei dieser Kreditkartenzahlung fordert die Übungskasse eine Unterschrift an. Schreib mit dem Finger oder Stift <strong>Schweiss</strong> auf das Feld am Terminal.</p><p class="intro">In der Praxis kann ein Terminal auch bei einer Kreditkarte eine PIN verlangen.</p>'+status,
   terminal('<span>Bitte unterschreiben · 18,00 €</span><canvas id="signature" class="signature" width="480" height="120" aria-label="Feld für die Musterunterschrift"></canvas>', '<div class="buttons">'+action('sign-ok','Unterschrift bestätigen',true)+action('sign-clear','Löschen')+'</div>')));
  const cv=document.querySelector('#signature'),ctx=cv.getContext('2d');
  let point=null;ctx.strokeStyle='#193e2f';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  function local(e){const box=cv.getBoundingClientRect();return [(e.clientX-box.left)*cv.width/box.width,(e.clientY-box.top)*cv.height/box.height];}
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);point=local(e);});
  cv.addEventListener('pointermove',e=>{
   if(!point)return;
   const next=local(e);
   if(Math.hypot(next[0]-point[0],next[1]-point[1])<1)return;
   ctx.beginPath();ctx.moveTo(...point);ctx.lineTo(...next);ctx.stroke();point=next;hasSignature=true;
  });
  for(const name of ['pointerup','pointercancel'])cv.addEventListener(name,()=>{point=null;});
 }
}
function approved(){
 const signature=card.type==='credit'?'<span>Unterschrift</span><span class="signed">Schweiss</span>':'<span>PIN bestätigt</span>';
 view('Zahlung genehmigt',layout('<h2>Sag voraus</h2><p>Der Einkauf wurde gerade bezahlt. Ist die Abbuchung in unserem Übungskonto schon bei den Girokonto-Umsätzen zu sehen?</p><div class="buttons">'+action('predict-yes','Ja, im Girokonto')+action('predict-no','Nein, noch nicht')+'</div>'+status,
 terminal('<strong>Zahlung genehmigt</strong><strong class="amount">18,00 €</strong>'+signature+'<span>'+ (method==='tap'?'Kontaktlos bezahlt':'Karte eingesetzt')+'</span>')));
}
function bank(next='activity'){
 const debit=card.type==='debit',credit=!debit;
 const bankRows=(rows)=>'<table><thead><tr><th>Buchung</th><th>Betrag</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table>';
 const activity=bankRows([...(debit?[['Heute · Trampolinhalle','−18,00 €']]:[]),['Gestern · Supermarkt','−24,50 €'],['Gestern · Überweisung','+45,00 €']]);
 const content=next==='activity'?activity:(credit?'<p class="pending"><strong>Vorgemerkt für die nächste Monatsabrechnung</strong></p>'+bankRows([['Heute · Trampolinhalle','18,00 €']]):'<p>Die girocard-Zahlung erscheint direkt im Girokonto unter „Umsätze“.</p>');
 const prompt=next==='activity'?'<h2>Prüfe den Verlauf</h2><p>Belege am Konto, ob die 18,00 € bereits abgebucht wurden.</p><div class="buttons">'+action('seen','18,00 € stehen in den Girokonto-Umsätzen')+action('missing','18,00 € fehlen in den Girokonto-Umsätzen')+'</div>':'<h2>Deute den Karteneintrag</h2><p>Wann wird das Girokonto für diese Kreditkartenzahlung belastet?</p><div class="buttons">'+action('monthly','Mit der nächsten Sammelabrechnung')+action('now','Schon jetzt')+'</div>';
 view('Kontoverlauf ansehen','<section class="bank"><div class="bank-head"><strong>KlarKonto · Modellbank</strong><small>Guten Tag, Axel Schweiss</small></div><div class="summary"><span>Girokonto</span><div class="balance">'+fmt(debit?102:120)+'</div><span class="badge">Bereits angemeldet</span></div><div class="bank-body"><div class="buttons">'+action('activity','Girokonto · Umsätze',next==='activity')+(credit?action('credit-activity','Kreditkarte · Kartenumsätze',next!=='activity'):'')+'</div>'+content+'</div></section><section class="panel">'+prompt+status+'<div id="follow"></div></section>');
}
function allowNext(id,label){document.querySelector('#follow').innerHTML='<div class="buttons">'+action(id,label,true)+'</div>';}
root.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const id=el.dataset.act;
 if(id==='card0'||id==='card1'){card=cards[Number(id.at(-1))];checkout();}
 else if(id==='reset'){choose();}
 else if(id==='tap'||id==='insert'){authorize(id);}
 else if(id.startsWith('digit')||id.startsWith('pin-')){
  if(id.startsWith('digit')&&pin.length<4)pin+=id.at(-1);
  if(id==='pin-clear')pin=pin.slice(0,-1);
  if(id==='pin-ok'){if(pin==='1234'){approved();return;}pin='';say('Die PIN stimmt noch nicht. Verwende die Übungs-PIN 1234.');}
  document.querySelector('#pin-view').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ');
 }
 else if(id==='sign-clear'){const cv=document.querySelector('#signature');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);hasSignature=false;say('');}
 else if(id==='sign-ok'){if(hasSignature)approved();else say('Schreib zuerst Schweiss in das Unterschriftsfeld.');}
 else if(id==='predict-yes'||id==='predict-no'){
  say('Vergleiche deine Vorhersage jetzt mit dem Kontoverlauf.','');
  document.querySelector('#status').insertAdjacentHTML('afterend','<div class="buttons">'+action('activity','KlarKonto öffnen · Umsätze prüfen',true)+'</div>');
  for(const b of root.querySelectorAll('[data-act^="predict-"]'))b.disabled=true;
 }
 else if(id==='activity'||id==='credit-activity'){bank(id);}
 else if(id==='seen'||id==='missing'){
  const debit=card.type==='debit';
  if((id==='seen')!==debit){say('Lies die Umsatzliste: Suche nach „Trampolinhalle“ und 18,00 €.');return;}
  if(debit){say('Belegt: Trampolinhalle, −18,00 €. Der Kontostand liegt bei 102,00 €.','good');allowNext('reset','Mit der anderen Karte vergleichen');}
  else{say('Belegt: Der Kontostand liegt noch bei 120,00 € und die Trampolinhalle fehlt im Girokonto.','good');allowNext('credit-activity','Kreditkartenumsätze ansehen');}
 }
 else if(id==='monthly'||id==='now'){
  if(id==='monthly'){say('Richtig. Die Zahlung ist vorgemerkt. Das Girokonto wird beim nächsten Abrechnungstermin belastet.','good');allowNext('reset','Mit der anderen Karte vergleichen');}
  else say('Lies den Hinweis über der Kartenbuchung.');
 }
});
choose();
</script></html>
