<!doctype html>
<html lang="de">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trampolinhalle · Übungskasse</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#172d3f;font:16px/1.45 system-ui,sans-serif}header{background:#172d3f;color:white;padding:1rem max(1rem,calc((100vw - 59rem)/2));font-weight:750}main{max-width:61rem;margin:auto;padding:1.3rem 1rem 2rem}h1{line-height:1.15;margin:.2rem 0 .65rem}h2{margin:.2rem 0 .55rem}.cards,.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card,.action{font:inherit;cursor:pointer;border-radius:8px;text-align:left}.card{color:white;min-height:clamp(100px,23vw,155px);border:0;padding:12px;position:relative;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 7px #0002}.card b{font-size:clamp(.82rem,4vw,1.18rem)}.card small{margin-top:10px}.card i{font-style:normal;align-self:flex-end}.red{background:linear-gradient(140deg,#a51120,#d32942)}.orange{background:linear-gradient(140deg,#a94b0b,#d76014)}.silver{background:linear-gradient(140deg,#425665,#637c8c)}.gold{background:linear-gradient(140deg,#51401e,#8c652f)}.panel{background:#fff;border-radius:14px;padding:1.1rem;margin:.9rem 0;border:1px solid #d2dde3}.terminal{background:#1d2a30;color:#b9ffdc;padding:1rem;border-radius:12px;margin-block:1rem;font-family:monospace;font-size:1.17rem}.action{padding:.75rem .9rem;background:white;border:1px solid #889eac;font-weight:700;color:inherit}.next{background:#176185;color:white;border:1px solid #176185}.status{font-weight:650;min-height:1.4rem;margin:.6rem 0 0}.bad{color:#a32333}.good{color:#16623c}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;max-width:16rem}.keypad button{text-align:center}button:focus-visible{outline:3px solid #087cae;outline-offset:3px}button:hover{filter:brightness(.95)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary div{background:#edf4f7;border-radius:8px;padding:.65rem}@media(max-width:430px){.cards,.actions{gap:7px}.card{padding:8px}.action{padding:.55rem}.summary{grid-template-columns:1fr}}
</style>
<header>Trampolinhalle · Übungskasse</header>
<main id="screen"></main>
<script>
const cards=[
 {issuer:'Sparkasse',type:'Debit',scheme:'girocard · Debit Mastercard',color:'red'},
 {issuer:'Volksbank Raiffeisenbank · GoldCard',type:'Credit',scheme:'Mastercard',color:'gold'}
];
const screen=document.querySelector('#screen');
let selected, digits='',stage='',mode='';
const button=(action,label,kind='')=>'<button class="action '+kind+'" data-act="'+action+'">'+label+'</button>';
const node=(caption,body)=>'<section class="panel"><div class="terminal">'+caption+'</div>'+body+'<p id="status" class="status" role="status"></p></section>';
function message(text,kind='bad'){const s=document.querySelector('#status');s.textContent=text;s.className='status '+kind;}
function render(next){
 stage=next;
 const credit=selected?.type==='Credit';
 if(next==='choose'){
  screen.innerHTML='<h1>Axel zahlt 18,00 €</h1><p>Die Kasse akzeptiert girocard und Mastercard. Wähle eine der beiden Musterkarten.</p><div class="cards">'+cards.map((c,i)=>'<button class="card '+c.color+'" data-act="c'+i+'"><b>'+c.issuer+'</b><small>AXEL SCHWEISS · MUSTER</small><i>'+c.type+' · '+c.scheme+'</i></button>').join('')+'</div>';
  return;
 }
 const title='<h1>'+selected.issuer+' · '+selected.type+'</h1>';
 if(next==='amount'){
  screen.innerHTML=title+node('Betrag: 18,00 € · Kontaktlos möglich','<h2>Prüfe den Betrag.</h2><div class="actions">'+button('tap','18,00 € bestätigen und Karte vorhalten','next')+button('wrong','18,00 € stimmt nicht')+'</div>');
 }else if(next==='pin'){
  screen.innerHTML=title+node('Übungsterminal · PIN erforderlich','<p>Das Terminal fordert bei diesem Einkauf eine PIN an. Nutze die <strong>Übungs-PIN 1234</strong> über die Tasten.</p><p id="display" aria-live="polite">○ ○ ○ ○</p><div class="keypad">'+[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(n=>button(n==='⌫'?'clear':n==='OK'?'confirm':'key'+n,String(n))).join('')+'</div>');
 }else if(next==='receipt'){
  screen.innerHTML=title+node('Zahlung erfolgt · 18,00 €','<h2>Wann wird das Girokonto belastet?</h2><div class="actions">'+button('direct','Zeitnah nach dem Einkauf')+button('later','Zum Termin der Sammelabrechnung')+'</div>');
 }else if(next==='success'){
  screen.innerHTML=title+node('Zahlung erfolgt · 18,00 €','<h2>'+ (credit?'Auf der Monatsabrechnung':'Zeitnah auf dem Girokonto')+'</h2><p>'+(credit?'Die Zahlung ist erfolgreich. Die 18,00 € stehen mit anderen Einkäufen auf der Monatsabrechnung. Das Girokonto wird erst zum Abrechnungstermin belastet.':'Die Zahlung ist erfolgreich. Die 18,00 € werden zeitnah vom Girokonto abgebucht.')+'</p><div class="actions">'+button('choose','Andere Karte ausprobieren')+button('signature','Zusatz: Kasse verlangt Unterschrift')+'</div>');
 }else if(next==='signature'){
  screen.innerHTML='<h1>Die Kasse verlangt eine Unterschrift</h1>'+node('Zusatzfall · elektronische Lastschrift','<p>Die Kasse nutzt die Karte für eine elektronische Lastschrift. Erteile im Beispiel die Erlaubnis zum Abbuchen, indem du den Musterbeleg bestätigst.</p>'+button('signed','Musterbeleg unterschreiben','next'));
 }else if(next==='signed'){
  screen.innerHTML='<h1>Lastschrift erlaubt</h1>'+node('Musterbeleg bestätigt','<p>Mit der Unterschrift erlaubst du dem Händler, den Betrag einzuziehen. Die Abbuchung kann später auf dem Konto erscheinen.</p>'+button('choose','Zur Kartenauswahl'));
 }
}
screen.addEventListener('click',event=>{
 const el=event.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(/^c[01]$/.test(a)){selected=cards[Number(a[1])];render('amount');}
 else if(a==='tap'){digits='';render('pin');}
 else if(a==='wrong'){message('Vergleiche die Anzeige mit dem Eintrittspreis: Beide zeigen 18,00 €.');}
 else if(a.startsWith('key')&&digits.length<4){digits+=a.at(-1);}
 else if(a==='clear'){digits=digits.slice(0,-1);}
 else if(a==='confirm'){
  if(digits==='1234'){render('receipt');}
  else{digits='';message('Die Eingabe stimmt noch nicht. Tippe die Übungs-PIN 1234.');}
 }
 else if(['direct','later'].includes(a)){
  if((selected.type==='Credit')===(a==='later'))render('success');
  else message(selected.type==='Credit'?'Achte auf „Credit“: Die Einkäufe werden zunächst gesammelt.':'Achte auf „Debit“: Diese Karte belastet das Girokonto zeitnah.');
 }else if(['choose','signature','signed'].includes(a)){render(a);}
 const display=document.querySelector('#display');if(display)display.textContent=Array.from({length:4},(_,i)=>i<digits.length?'●':'○').join(' ');
});
render('choose');
</script></html>
