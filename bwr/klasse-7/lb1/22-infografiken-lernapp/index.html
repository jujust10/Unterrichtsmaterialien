<title>Infografiken auswerten</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142931;background:#f3f6f4;line-height:1.48;--ink:#142931;--green:#1a5b4c;--light:#e8f2eb;--line:#cad9d2}
*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:clamp(12px,3vw,37px)}

nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:8px 13px;min-height:44px;font-weight:680}button[aria-current=true],button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{cursor:default}button[hidden], [hidden]{display:none!important}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #8059aa;outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:15px;align-items:start}.card{background:white;border:1px solid var(--line);padding:clamp(13px,2vw,22px);border-radius:16px;min-width:0}
#chart{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto}h2{margin:0 0 8px;font-size:1.35rem;line-height:1.2}.chart-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.chart-heading img{width:clamp(65px,10vw,98px);height:auto;border-radius:7px}.subtitle,.source,.counter,.unit{color:#415956}.subtitle{margin:3px 0 9px}.source{display:block;margin-top:13px;font-size:.79rem}.facts{display:flex;gap:8px;margin:10px 0}.facts strong{flex:1;background:var(--light);border-radius:8px;padding:6px 9px}.bars{display:grid;gap:6px}.bar-row{display:grid;grid-template-columns:minmax(100px,1.04fr) minmax(66px,1fr) minmax(42px,max-content);align-items:center;gap:7px;font-size:.87rem;min-height:20px;line-height:1.2}.bar-track{height:9px;background:#e4ece7;border-radius:5px}.bar-track span{display:block;width:var(--width);height:100%;background:#357966;border-radius:5px}.bar-row strong{text-align:right}.chart-axis{display:flex;justify-content:space-between;padding-top:3px;font-size:.72rem;color:#415956}.axis-bar{display:grid;grid-template-columns:minmax(100px,1.04fr) minmax(66px,1fr) minmax(42px,max-content);gap:7px}.axis-bar>div{grid-column:2}
svg.plot{width:100%;height:auto;display:block}.grid{stroke:#d8e4de}.plot text{fill:#314f58;font:11px system-ui,sans-serif}.plot .value{font-weight:800;fill:#164f68}.plot .curve{fill:none;stroke:#185d79;stroke-width:3}.plot circle{fill:#185d79}
.counter{margin:0 0 8px;font-size:.87rem;font-weight:650}#prompt{margin:0 0 15px;font-size:1.15rem;font-weight:700}.dependency{padding:9px 12px;background:#eff3ff;border-left:4px solid #5269a7;border-radius:6px;margin:0 0 14px}.dependency p{margin:3px 0}fieldset{border:0;margin:0;padding:0}.field{display:block;margin-bottom:12px}.field>span{display:block;font-weight:620}.field input,.field select{background:white;color:var(--ink);width:100%;border:1px solid #769188;border-radius:8px;padding:8px 10px;min-height:44px}.field input{max-width:220px}.field .unit{display:inline;margin-left:7px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.feedback,.hints{margin:9px 0 0}.feedback:empty,.hints:empty{display:none}.feedback{font-weight:700;padding:9px 12px;border-radius:8px}.feedback.right{background:#e4f4e8;color:#125932}.feedback.wrong{background:#fcf0dd;color:#743314}.hints{padding-left:1.5rem;color:#483c2d}.hints li{margin:3px 0}

<body>
<main>
<header><div><h1>Infografiken auswerten</h1><p>Lies die Grafik. Rechne im Heft und prüfe hier deine Antwort.</p></div><span id="progress" aria-live="polite"></span></header>
<nav id="stations" aria-label="Aufgaben auf dem Arbeitsblatt"></nav>
<div class="layout">
<section id="chart" class="card" aria-label="Diagramm zur Aufgabe"></section>
<section id="exercise" class="card" aria-labelledby="prompt">
<p class="counter" id="counter"></p>
<h2 id="prompt" tabindex="-1"></h2>
<div id="dependency" class="dependency" hidden></div>
<form id="check-form" novalidate>
<fieldset id="fields" aria-label="Deine Antwort"></fieldset>
<div class="buttons">
<button class="primary" id="check" type="submit">Antwort prüfen</button>
<button id="back" type="button">Zurück</button>
<button class="primary" id="forward" type="button" hidden>Weiter</button>
</div>
</form>
<p id="feedback" class="feedback" role="status"></p>
<ol id="hints" class="hints"></ol>
<div id="answer-key" hidden></div>
</section>
</div>
<footer>Alle Zahlen und Aufgaben beziehen sich auf das Arbeitsblatt. Dein Fortschritt wird auf diesem Gerät gespeichert.</footer>
</main>

  task('1a','Wie viele der 13- bis 20-Jährigen haben Schulden?', [number('Jugendliche von 100',14,'von 100')], ['Lies die Angabe über den Balken.', 'Die gesuchte Zahl steht vor „von 100“.'], '14 von 100 Jugendlichen haben Schulden. Das sind 14 %.'),
  task('1b','Nenne die durchschnittliche Höhe der Schulden.',[number('Durchschnittliche Schulden',426,'€')],['Suche die Angabe zum Durchschnitt über dem Diagramm.','Die durchschnittliche Schuldenhöhe ist ein Betrag in Euro.'],'Die durchschnittliche Schuldenhöhe beträgt 426 €.'),

const all=stations.flatMap(station=>station.tasks);
const lookup=new Map(all.map(item=>[item.id,item]));
const $=id=>document.getElementById(id);
const storageKey='bwr7-infografiken-stationen-v1';
let progress={};
let current='1a';
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 if(lookup.has(saved.current)) current=saved.current;
 if(saved.progress&&typeof saved.progress==='object') progress=saved.progress;
}catch{}
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify({current,progress}));}catch{}};
const fmt=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(n);
const tag=(name,content,cls)=>{const node=document.createElement(name);if(content!=null)node.textContent=content;if(cls)node.className=cls;return node;};
const locationOf=id=>stations.find(station=>station.tasks.some(item=>item.id===id));
const solved=id=>progress[id]?.done===true;
let drawn=null;
function drawChart(station){
 if(drawn===station)return;
 drawn=station;
 const root=$('chart');
 root.replaceChildren();
 root.scrollTop=0;
 const heading=tag('div',null,'chart-heading');
 heading.append(tag('h2',station.title));
 if(station.logo){const logo=tag('img');logo.src=station.logo;logo.alt='Snack Attack';heading.append(logo);}
 root.append(heading,tag('p',station.subtitle,'subtitle'));
 if(station.facts){const facts=tag('div',null,'facts');for(const fact of station.facts)facts.append(tag('strong',fact));root.append(facts);}
 if(station.kind==='line'){
   const range=120000;
   const coords=station.points.map(([year,value],i)=>[76+i*59,168-126*value/range,year,value]);
   const grid=[0,30000,60000,90000,120000].map(value=>{
     const y=168-126*value/range;
     return '<path class="grid" d="M54 '+y+'H451"/><text x="48" y="'+(y+4)+'" text-anchor="end">'+fmt(value)+'</text>';
   }).join('');
   const points=coords.map(([x,y,year,value])=>'<circle cx="'+x+'" cy="'+y+'" r="3.5"/><text class="value" x="'+x+'" y="'+(y-9)+'" text-anchor="middle">'+fmt(value)+'</text><text x="'+x+'" y="187" text-anchor="middle">'+year+'</text>').join('');
   const path=coords.map(([x,y])=>x+','+y).join(' ');
   const chart=tag('div');
   const description=station.points.map(([year,val])=>year+': '+fmt(val)+' Abos').join('; ');
   chart.innerHTML='<svg class="plot" viewBox="0 0 470 202" role="img" aria-label="'+description+'">'+grid+'<path stroke="#54716b" fill="none" d="M54 40V168H451"/><polyline class="curve" points="'+path+'"/>'+points+'</svg>';
   root.append(chart);
 }else{
   const chart=tag('div',null,'bars');
   for(const [name,value] of station.bars){
     const row=tag('div',null,'bar-row');
     const track=tag('div',null,'bar-track');
     const fill=tag('span');
     fill.style.setProperty('--width',value/station.max*100+'%');
     track.setAttribute('aria-hidden','true');
     track.append(fill);
     row.append(tag('span',name),track,tag('strong',fmt(value)+' %'));
     chart.append(row);
   }
   root.append(chart);
   if(station.axis){
     const wrapper=tag('div',null,'axis-bar');
     const axis=tag('div',null,'chart-axis');
     for(const number of [0,10,20,30,40])axis.append(tag('span',number+' %'));
     wrapper.append(axis);root.append(wrapper);
   }
 }
 root.append(tag('small',station.source,'source'));
}
function parseNumber(raw,unit){
 const clean=raw.trim().replace(/[\s\u00a0\u202f]/g,'').replace(/[€%]$/,'');
 if(!/^[+-]?\d+(?:[.,]\d+)*$/.test(clean))return NaN;
 if(clean.includes(',')){
   if(!/^[+-]?(?:\d+|\d{1,3}(?:\.\d{3})+),\d+$/.test(clean))return NaN;
   return Number(clean.replaceAll('.','').replace(',','.'));
 }
 if(/^[+-]?\d{1,3}(?:\.\d{3})+$/.test(clean)&&unit!=='%') return Number(clean.replaceAll('.',''));
 return Number(clean);
}
function feedback(item){
 const record=progress[item.id]||{};
 const notice=$('feedback'),hints=$('hints'),key=$('answer-key');
 const hintCount=Math.min(record.tries||0,item.hints.length);
 hints.replaceChildren();
 for(let i=0;i<hintCount;i++) hints.append(tag('li',item.hints[i]));
 notice.className='feedback';
 notice.textContent='';
 key.hidden=true;
 key.replaceChildren();
 if(record.done){
   notice.classList.add('right');
   notice.textContent='Richtig!';
   key.append(tag('p',item.solution));
   key.hidden=false;
 }else if(hintCount){
   notice.classList.add('wrong');
   notice.textContent='Noch nicht richtig. '+(hintCount===1?'Hier ist der erste Tipp.':'Nutze die Tipps für deinen nächsten Versuch.');
 }
 $('check').hidden=!!record.done;
 $('forward').hidden=!record.done;
 const next=all[all.indexOf(item)+1];
 $('forward').textContent=next?'Weiter':'Zur Aufgabenübersicht';
 $('progress').textContent=all.filter(item=>solved(item.id)).length+' / '+all.length+' gelöst';
}
function show(id,focus=false){

 help.hidden=item.needs.length===0;
 for(const previous of item.needs){
   const dependency=lookup.get(previous);
   const head=tag('strong','Aus Aufgabe '+previous);
   help.append(head,tag('p',dependency.prompt));
   if(solved(previous))help.append(tag('p',dependency.solution));
   else{
     const button=tag('button','Voraufgabe öffnen');
     button.type='button';button.addEventListener('click',()=>show(previous,true));help.append(button);
   }
 }
 const fields=$('fields');
 fields.replaceChildren();
 for(const [i,field] of item.fields.entries()){
   const label=tag('label',null,'field');
   label.append(tag('span',field.label));
   const input=tag(field.options?'select':'input');
   input.name='field'+i;
   if(field.options){
     input.append(new Option('Bitte auswählen',''));
     for(const [value,caption] of field.options)input.append(new Option(caption,value));
   }else {input.type='text';input.inputMode='decimal';input.autocomplete='off';}
   input.value=progress[id]?.values?.[i]||'';
   input.disabled=solved(id);
   label.append(input);
   if(field.unit)label.append(tag('span',field.unit,'unit'));
   fields.append(label);
 }
 $('back').hidden=(all.indexOf(item)===0);
 feedback(item);
 if(focus){
   $('prompt').focus({preventScroll:true});
   if(matchMedia('(max-width: 740px)').matches){
     const promptTop=$('prompt').getBoundingClientRect().top;
     const chartBottom=$('chart').getBoundingClientRect().bottom;
     if(promptTop<chartBottom||promptTop>innerHeight-160){
       window.scrollBy({top:promptTop-Math.min($('chart').offsetHeight,innerHeight*.49)-22});
     }
   }
 }
}
$('check-form').addEventListener('submit',event=>{
 event.preventDefault();
 const item=lookup.get(current);
 if(solved(current))return;
 const fields=Array.from($('fields').querySelectorAll('input,select'));
 const values=fields.map(field=>field.value.trim());
 if(values.some(value=>!value)){
   $('feedback').className='feedback wrong';$('feedback').textContent='Fülle zuerst alle Felder aus.';
   fields[values.findIndex(value=>!value)].focus();
   return;
 }
 const correct=item.fields.every((field,i)=>field.options?values[i]===field.answer:Math.abs(parseNumber(values[i],field.unit)-field.answer)<1e-7);
 const record=progress[current]||{tries:0};
 if(!correct) record.tries++;
 record.done=correct;record.values=values;progress[current]=record;save();
 if(correct){show(current);$('forward').focus({preventScroll:true});}else feedback(item);
});
$('back').addEventListener('click',()=>show(all.find((item,i)=>all[i+1]?.id===current).id,true));
$('forward').addEventListener('click',()=>{
 const next=all[all.indexOf(lookup.get(current))+1]||all.find(item=>!solved(item.id));
 if(next){show(next.id,true);return;}
 const nav=$('stations');
 $('feedback').textContent='Du hast alle Aufgaben bearbeitet. Über die Aufgabenleiste kannst du deine Lösungen nochmals ansehen.';
 $('forward').hidden=true;
 nav.querySelector('button').focus();
});
show(current);
</script>
</body>
</html>
